<!DOCTYPE html>
<html lang="tj">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить издательство</title>
    <link rel="stylesheet" href="/css/Forms_Style.css">
</head>

<body>
<script src="/js/getCities.js" type="text/javascript"></script>
<script src="/js/getLSItem.js" type="text/javascript"></script>
<div class="form-container">
    <h2>Добавить</h2>
    <form action="/addPublisher" method="post">
        <div class="form-group">
            <label for="fullname">Название:</label>
            <input type="text" id="fullname" name="publisherName" required>
        </div>
        <div>
            <label for="city_List"> Страна </label>
            <select id="city_List" name="selCity">
                <option value="">Выбирите страну</option>
            </select>
        </div>
        <div class="form-group">
            <label for="address">Аддресс</label>
            <input type="text" id="address" name="address">
        </div>
        <div class="form-group">
            <button type="submit">Подтвердить</button>
        </div>

        <div class="form-group">
            <button type="button" onclick="window.parent.closeIframe(getFrmId())">
                Назад
            </button>
        </div>

</form>
</div>
<script>function goHome() {
    window.location.replace("/");
}</script>
<script>
    document.querySelector('form[action="/addPublisher"]').addEventListener('submit', async function(event) {
        event.preventDefault();
        try {
            const response = await fetch('/addPublisher', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                body: new URLSearchParams(new FormData(this))
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || 'Не удалось сохранить издательство.');
            this.reset();
            if (typeof window.notifyAdminFormSaved === 'function') {
                window.notifyAdminFormSaved();
            }
        } catch (error) {
            alert(error.message);
        }
    });
</script>
<script src="/js/admin-form-bridge.js"></script>
</body>
</html>
