<!DOCTYPE html>
<html lang="tj">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Классификатор</title>
    <link rel="stylesheet" href="/css/Forms_Style.css">
</head>
<body>
<div class="form-container">
    <h2 id="formTitle">Добавление классификатора</h2>
    <form id="directionForm" onsubmit="submitDirectionForm(); return false;">
        <input type="hidden" id="rowId" name="rowId">

        <div class="form-group">
            <label for="title">Название:</label>
            <input type="text" id="title" name="title" required>
        </div>

        <div class="form-group">
            <label for="udc">УДК:</label>
            <input type="text" id="udc" name="udc" required>
        </div>

        <div class="form-group">
            <label for="parentId">Родительский классификатор:</label>
            <select id="parentId" name="parentId">
                <option value="">Нет</option>
            </select>
        </div>

        <div class="form-group">
            <button type="submit" id="submitBtn">Добавить</button>
            <button type="button" onclick="window.parent.closeIframe(4)">Назад</button>
        </div>
    </form>
</div>

<script src="/js/dataForDirectionForm.js"></script>
<script src="/js/admin-form-bridge.js"></script>
</body>
</html>
