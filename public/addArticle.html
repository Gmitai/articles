<!DOCTYPE html>
<html lang="tj">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить</title>
    <link rel="stylesheet" href="/css/Forms_Style.css">
    <link rel="stylesheet" href="/css/multiselect.css">
    <link rel="stylesheet" href="/css/View_Forms_Style.css">
</head>

<body>


<div class="form-container">
    <h2>Добавить</h2>
    <form action="/addArticle" method="post" enctype="multipart/form-data">
        <div class="form-group" >
            <label for="title">Название:</label>
            <input type="text" id="title" name="aricleName" required>
        </div>

        <div class="multiselect-container author-select-container">
            <label for="authorSearchInput">Авторы</label>
            <div class="author-select-row">
                <input type="text" id="authorSearchInput" name="authorNames" class="author-search-input" list="authorSuggestions" placeholder="Введите ФИО через запятую" autocomplete="off">
                <datalist id="authorSuggestions"></datalist>
                <button type="button" id="authorToggleBtn" class="tree-button author-list-toggle" title="Открыть список авторов" aria-label="Открыть список авторов">☷</button>
            </div>
            <div id="selected-values" class="selected-values">Выберите из списка или введите ФИО</div>
            <div class="dropdown" id="dropdown"></div>
        </div>

        <div class="form-group">
            <label for="fileUpload">Выбирите файл:</label>
            <input type="file" id="fileUpload" accept="application/pdf,.pdf,.doc,.docx,.djvu,.djv,image/jpeg,.jpg,.jpeg,image/png,.png" name="fileData" multiple>
            <small>Один PDF, Word или DjVu либо несколько сканов JPG/PNG — они будут собраны в PDF.</small>
        </div>
        <div class="form-group">
            <label for="pageCount">Количество страниц:</label>
            <input type="number" id="pageCount" name="pCount" required>
        </div>

        <div class="form-group">
            <label for="yearOfPublish">Год выпуска:</label>
            <input type="date" id="yearOfPublish" name="publishYear" required>
        </div>

        <div class="tree-select-container">
            <label for="udcSearchInput">Направление (УДК)</label>
            <div class="udc-select-row">
                <input type="text" id="udcSearchInput" name="udcCode" class="udc-code-input" list="udcSuggestions" placeholder="Введите код УДК" autocomplete="off">
                <datalist id="udcSuggestions"></datalist>
                <button type="button" id="treeToggleBtn" class="tree-button udc-tree-toggle" title="Открыть список УДК" aria-label="Открыть список УДК">УДК</button>
            </div>

            <div id="treeDropdown" class="tree-dropdown hidden">
                <ul id="treeUDC" class="tree"></ul>
            </div>

        </div>

        <div class="publisher-select-container">
            <label for="publisherSearchInput">Издательство</label>
            <div class="publisher-select-row">
                <input type="text" id="publisherSearchInput" name="publisherName" class="author-search-input" list="publisherSuggestions" placeholder="Введите название издательства" autocomplete="off" required>
                <datalist id="publisherSuggestions"></datalist>
                <input type="hidden" id="PublisherList" name="selPublisher" value="">
                <button type="button" id="publisherToggleBtn" class="tree-button publisher-list-toggle" title="Открыть список издательств" aria-label="Открыть список издательств">☷</button>
            </div>
            <div id="publisherDropdown" class="publisher-dropdown hidden" role="listbox"></div>
        </div>



        <div class="form-group">
            <button type="submit" >Подтвердить</button>
        </div>

        <div class="form-group">
            <button type="button" onclick="window.parent.closeIframe(getFrmId())">
                Назад
            </button>
        </div>
    </form>
</div>
<script src="/js/getDirections.js" type="text/javascript"></script>
<script src="/js/getPublishers.js" type="text/javascript"></script>
<script src="/js/getLSItem.js" type="text/javascript"></script>
<script src="/js/multiselect.js" type="text/javascript"></script>
<script src="/js/creatTreeView.js" type="text/javascript"></script>


<script>
    const addArticleForm = document.querySelector('form[action="/addArticle"]');
    const bookFileInput = document.getElementById('fileUpload');

    if (bookFileInput) {
        bookFileInput.addEventListener('change', function() {
            const files = Array.from(this.files || []);
            if (!files.length) return;

            const isSingleDocument = files.length === 1 && /\.(pdf|docx?|djvu?)$/i.test(files[0].name);
            const areImages = files.every(file => /\.(jpe?g|png)$/i.test(file.name));
            const validSelection = files.length <= 500 &&
                files.reduce((total, file) => total + file.size, 0) <= 500 * 1024 * 1024 &&
                (isSingleDocument || areImages);

            if (!validSelection) {
                alert('Выберите один PDF, Word или DjVu либо до 500 изображений JPG/PNG общим размером не более 500 МБ. Форматы нельзя смешивать.');
                this.value = '';
            }
        });
    }

    if (addArticleForm) {
        addArticleForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            try {
                const formData = new FormData(this);
                formData.set('udcCode', (document.getElementById('udcSearchInput')?.value || '').trim());
                const selectedBookFiles = Array.from(bookFileInput?.files || []);
                const keepOriginal = selectedBookFiles.length === 1 &&
                    !/\.pdf$/i.test(selectedBookFiles[0].name) &&
                    !window.confirm('Файл не в PDF. Конвертировать его в PDF? Нажмите «Отмена», чтобы сохранить исходный файл без конвертации.');
                if (keepOriginal) formData.set('keepOriginal', 'true');

                const response = await fetch('/addArticle', {
                    method: 'POST',
                    body: formData
                });

                const text = await response.text();

                if (!response.ok) {
                    throw new Error(text || 'Ошибка добавления');
                }

                alert(text || 'Статья успешно добавлена');

                this.reset();

                if (typeof clearSelectedAuthors === 'function') clearSelectedAuthors();

                const selectedValues = document.getElementById('selected-values');

                if (selectedValues) {
                    selectedValues.textContent = 'Выбирите автора (ов)';
                }

                if (typeof updateDropdownFromSelected === 'function') {
                    updateDropdownFromSelected();
                }

                document.querySelectorAll('.tree-radio').forEach(radio => {
                    radio.checked = false;
                });

                document.querySelectorAll('#treeUDC li').forEach(li => {
                    li.classList.remove('selected');
                });

                const treeDropdown = document.getElementById('treeDropdown');

                if (treeDropdown) {
                    treeDropdown.classList.add('hidden');
                }

                document.querySelectorAll('#treeUDC .toggle').forEach(toggle => {
                    const childUl = toggle.closest('li')?.querySelector(':scope > ul');

                    if (childUl) {
                        childUl.classList.add('hidden');
                    }

                    toggle.textContent = '+';
                    toggle.dataset.state = 'closed';
                });

                const publisherList = document.getElementById('PublisherList');

                if (publisherList) {
                    publisherList.value = '';
                }

                if (typeof window.notifyAdminFormSaved === 'function') {
                    window.notifyAdminFormSaved();
                }

            } catch (error) {
                console.error('Ошибка добавления:', error);
                alert(error.message);
            }
        });
    }
</script>
<script src="/js/admin-form-bridge.js"></script>
</body>
</html>
