<!DOCTYPE html>
<html lang="tj">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить</title>
    <link rel="stylesheet" href="/css/Forms_Style.css">
    <link rel="stylesheet" href="/css/multiselect.css">
    <link rel="stylesheet" href="/css/View_Forms_Style.css">
</head>

<body>


<div class="form-container">
    <h2>Добавить</h2>
    <form action="/addArticle" method="post" enctype="multipart/form-data">
        <div class="form-group" >
            <label for="title">Название:</label>
            <input type="text" id="title" name="aricleName" required>
        </div>

        <div class="multiselect-container">
            <div id="selected-values" class="selected-values">Выбирите автора (ов)</div>

                <div class="dropdown" id="dropdown">

            </div>
        </div>

        <div class="form-group">
            <label for="fileUpload">Выбирите файл:</label>
            <input type="file" id="fileUpload" accept="application/pdf" name="fileData">
        </div>
        <div class="form-group">
            <label for="pageCount">Количество страниц:</label>
            <input type="number" id="pageCount" name="pCount" required>
        </div>

        <div class="form-group">
            <label for="yearOfPublish">Год выпуска:</label>
            <input type="date" id="yearOfPublish" name="publishYear" required>
        </div>

        <div class="tree-select-container">

            <button type="button" id="treeToggleBtn" class="tree-button">
                Направление
            </button>

            <div id="treeDropdown" class="tree-dropdown hidden">
                <ul id="treeUDC" class="tree"></ul>
            </div>

        </div>

        <div class="form-group">
            <label for="PublisherList"> Издательство </label>
            <select id="PublisherList" name="selPublisher" required>
                <option value="">Выбирите издательство</option>
            </select>
        </div>

        <div class="form-group">
            <button type="submit" >Подтвердить</button>
        </div>

        <div class="form-group">
            <button type="button" onclick="window.parent.closeIframe(getFrmId())">
                Назад
            </button>
        </div>
    </form>
</div>
<script src="/js/getDirections.js" type="text/javascript"></script>
<script src="/js/getPublishers.js" type="text/javascript"></script>
<script src="/js/getAuthors.js" type="text/javascript"></script>
<script src="/js/getLSItem.js" type="text/javascript"></script>
<script src="/js/multiselect.js" type="text/javascript"></script>
<script src="/js/creatTreeView.js" type="text/javascript"></script>


<script>
    const addArticleForm = document.querySelector('form[action="/addArticle"]');

    if (addArticleForm) {
        addArticleForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            try {
                const formData = new FormData(this);

                const response = await fetch('/addArticle', {
                    method: 'POST',
                    body: formData
                });

                const text = await response.text();

                if (!response.ok) {
                    throw new Error(text || 'Ошибка добавления');
                }

                alert(text || 'Статья успешно добавлена');

                this.reset();

                if (typeof selectedAuthors !== 'undefined') {
                    selectedAuthors = [];
                }

                const selectedValues = document.getElementById('selected-values');

                if (selectedValues) {
                    selectedValues.textContent = 'Выбирите автора (ов)';
                }

                if (typeof updateDropdownFromSelected === 'function') {
                    updateDropdownFromSelected();
                }

                document.querySelectorAll('.tree-radio').forEach(radio => {
                    radio.checked = false;
                });

                document.querySelectorAll('#treeUDC li').forEach(li => {
                    li.classList.remove('selected');
                });

                const treeDropdown = document.getElementById('treeDropdown');

                if (treeDropdown) {
                    treeDropdown.classList.add('hidden');
                }

                document.querySelectorAll('#treeUDC .toggle').forEach(toggle => {
                    const childUl = toggle.closest('li')?.querySelector(':scope > ul');

                    if (childUl) {
                        childUl.classList.add('hidden');
                    }

                    toggle.textContent = '+';
                    toggle.dataset.state = 'closed';
                });

                const publisherList = document.getElementById('PublisherList');

                if (publisherList) {
                    publisherList.value = '';
                }

                if (window.parent && window.parent.loadForKey) {
                    const active = window.parent.document.querySelector('.nav button.active');

                    if (active) {
                        await window.parent.loadForKey(active.dataset.key);
                    }
                }

                const frame = window.parent.document.getElementById('mIframe1');

                if (frame) {
                    frame.style.display = 'block';
                }

            } catch (error) {
                console.error('Ошибка добавления:', error);
                alert(error.message);
            }
        });
    }
</script>


</body>
</html>
