<!DOCTYPE html>
<html lang="tj">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование издательмтва</title>
    <link rel="stylesheet" href="/css/Forms_Style.css">
</head>
<body>
<div class="form-container">
    <h2>Редактирование</h2>

    <form id="editForm" onsubmit="submitPublisherForm(); return false;">
        <input type="hidden" id="rowId" name="rowId">

        <div class="form-group">
            <label for="publisherName">Название:</label>
            <input type="text" id="publisherName" name="publisherName" required>
        </div>

        <div class="form-group">
            <label for="city_List">Город/Страна:</label>
            <select id="city_List" name="selCity" required></select>
        </div>

        <div class="form-group">
            <label for="address">Аддресс:</label>
            <input type="text" id="address" name="address" required>
        </div>

        <div class="form-group">
            <button type="submit">Подтвердить</button>
            <button type="button" onclick="window.parent.closeIframe(getFrmId())">Назад</button>
        </div>
    </form>
</div>

<script src="/js/getLSItem.js" type="text/javascript"></script>
<script src="/js/dataForPublisherForm.js"></script>
</body>
</html>
