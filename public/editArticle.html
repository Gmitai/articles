<!DOCTYPE html>
<html lang="tj">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование</title>
    <link rel="stylesheet" href="/css/Forms_Style.css">
    <link rel="stylesheet" href="/css/multiselect.css">
    <link rel="stylesheet" href="/css/View_Forms_Style.css">
</head>

<body>

<div class="form-container">
    <h2>Редактирование</h2>

    <form id="editForm" action="/updateArticle" method="post" enctype="multipart/form-data">

        <input type="hidden" id="rowId" name="rowId">

        <div class="form-group">
            <label for="title">Название:</label>
            <input type="text" id="title" name="aricleName" required>
        </div>

        <div class="multiselect-container author-select-container">
            <label for="authorSearchInput">Авторы</label>
            <div class="author-select-row">
                <input type="text" id="authorSearchInput" name="authorNames" class="author-search-input" list="authorSuggestions" placeholder="Введите ФИО через запятую" autocomplete="off">
                <datalist id="authorSuggestions"></datalist>
                <button type="button" id="authorToggleBtn" class="tree-button author-list-toggle" title="Открыть список авторов" aria-label="Открыть список авторов">☷</button>
            </div>
            <div class="dropdown" id="dropdown"></div>
        </div>

        <div class="form-group">
            <label for="genreId">Жанр:</label>
            <select id="genreId" name="genreId"><option value="">Без жанра</option></select>
        </div>

        <div class="form-group">
            <label for="fileUpload">Файл (PDF, Word или DjVu):</label>
            <input type="file" id="fileUpload" accept="application/pdf,.pdf,.doc,.docx,.djvu,.djv,image/jpeg,.jpg,.jpeg,image/png,.png" name="fileData">
        </div>

        <div class="form-group">
            <label for="pageCount">Количество страниц:</label>
            <input type="number" id="pageCount" name="pCount" required>
        </div>

        <div class="form-group">
            <label for="yearOfPublish">Год выпуска:</label>
            <input type="date" id="yearOfPublish" name="publishYear" required>
        </div>

        <div class="form-group identifier-select-container">
            <label for="bbk">ББК:</label>
            <div class="identifier-select-row"><input type="text" id="bbk" name="bbk" maxlength="50" autocomplete="off"><button type="button" class="tree-button identifier-toggle" data-for="bbk" aria-label="Выбрать ББК">▾</button></div>
            <div class="identifier-dropdown hidden" data-list-for="bbk" role="listbox"></div>
        </div>
        <div class="form-group identifier-select-container">
            <label for="isbn">ISBN:</label>
            <div class="identifier-select-row"><input type="text" id="isbn" name="isbn" maxlength="32" autocomplete="off"><button type="button" class="tree-button identifier-toggle" data-for="isbn" aria-label="Выбрать ISBN">▾</button></div>
            <div class="identifier-dropdown hidden" data-list-for="isbn" role="listbox"></div>
        </div>

        <div class="tree-select-container">
            <label for="udcSearchInput">Направление (УДК)</label>
            <div class="udc-select-row">
                <input type="text" id="udcSearchInput" name="udcCode" class="udc-code-input" list="udcSuggestions" placeholder="Введите код УДК" autocomplete="off">
                <datalist id="udcSuggestions"></datalist>
                <button type="button" id="treeToggleBtn" class="tree-button udc-tree-toggle" title="Открыть список УДК" aria-label="Открыть список УДК">&#9662;</button>
            </div>

            <div id="treeDropdown" class="tree-dropdown hidden">
                <ul id="treeUDC" class="tree"></ul>
            </div>

        </div>

        <div class="publisher-select-container">
            <label for="publisherSearchInput">Издательство</label>
            <div class="publisher-select-row">
                <input type="text" id="publisherSearchInput" name="publisherName" class="author-search-input" list="publisherSuggestions" placeholder="Введите название издательства" autocomplete="off" required>
                <datalist id="publisherSuggestions"></datalist>
                <input type="hidden" id="PublisherList" name="selPublisher" value="">
                <button type="button" id="publisherToggleBtn" class="tree-button publisher-list-toggle" title="Открыть список издательств" aria-label="Открыть список издательств">&#9662;</button>
            </div>
            <div id="publisherDropdown" class="publisher-dropdown hidden" role="listbox"></div>
        </div>



        <div class="form-group">
            <button type="submit">Подтвердить</button>
        </div>

        <div class="form-group">
            <button type="button" id="Back" onclick="window.parent.closeIframe(getFrmId())">
                Назад
            </button>
        </div>
    </form>
</div>

<script src="/js/creatTreeView.js" defer></script>
<script src="/js/getPublishers.js" defer></script>
<script src="/js/multiselect.js" defer></script>
<script src="/js/dataForArticleForm.js" defer></script>
<script src="/js/getLSItem.js" type="text/javascript" defer></script>
<script src="/js/book-file-metadata.js" defer></script>
<script src="/js/admin-form-bridge.js" defer></script>
<script src="/js/book-identifiers.js" defer></script>
<script src="/js/article-genres.js" defer></script>
</body>
</html>
