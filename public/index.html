<!doctype html>
<html lang="tj">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мақолаҳо</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/Forms_Style.css">
</head>
<body>
<div class="app" role="application">
    <aside class="sidebar" aria-label="Главная навигация">
        <div class="brand">Articles</div>
        <nav class="nav" role="navigation" aria-label="Меню" id="nav">
        </nav>
        <div class="sidebar-footer">Пользователь: <strong>Админ</strong></div>
    </aside>

    <main class="main">
        <div class="header">
            <h2 id="page-title">Редаетирование</h2>

            <div class="actions" id="add_content">
                <button id="homeBtn" type="button">Главная</button>
                <button id="add" type="button">Добавить</button>
            </div>
        </div>

        <section id="main-content" class="content" tabindex="0" aria-live="polite">
            <div class="placeholder" id="placeholder">
                <div class="loader" aria-hidden="true"></div>
                <div>Выберите таблицу в левой колонке, чтобы увидеть данные.</div>
            </div>
        </section>
    </main>

    <iframe src="/addArticle.html" class="modal-iframe" id="mIframe1"></iframe>
    <iframe src="/addAuthors.html" class="modal-iframe1" id="mIframe2"></iframe>
    <iframe src="/addPublisher.html" class="modal-iframe3" id="mIframe3"></iframe>
    <iframe src="/editArticle.html" class="modal-iframe4" id="meIframe1"></iframe>
    <iframe src="/editAuthors.html" class="modal-iframe5" id="meIframe2"></iframe>
    <iframe src="/editPublisher.html" class="modal-iframe6" id="meIframe3"></iframe>
    <iframe src="/directionForm.html" class="modal-iframe" id="mIframe4"></iframe>
    <iframe src="/directionForm.html" class="modal-iframe4" id="meIframe4"></iframe>
    <div id="addUserModal" class="admin-user-modal" hidden>
        <section class="admin-user-dialog" role="dialog" aria-modal="true" aria-labelledby="addUserTitle">
            <button id="closeAddUserModal" class="admin-user-close" type="button" aria-label="Закрыть">×</button>
            <h2 id="addUserTitle">Добавить пользователя</h2>
            <form id="addUserForm">
                <label>Email<input type="email" name="eMail" maxlength="30" required></label>
                <label>Логин<input type="text" name="login" maxlength="30" required></label>
                <label>Пароль<input id="adminUserPassword" type="password" name="password" maxlength="72" required></label>
                <label>Имя<input type="text" name="firstName" maxlength="25"></label>
                <label>Фамилия<input type="text" name="lastName" maxlength="25"></label>
                <label>Отчество<input type="text" name="familyName" maxlength="25"></label>
                <label>Псевдоним<input type="text" name="pseudonym" maxlength="50"></label>
                <label>Права
                    <select name="role">
                        <option value="user">Пользователь</option>
                        <option value="admin">Администратор</option>
                    </select>
                </label>
                <p id="addUserMessage" class="admin-user-message" aria-live="polite"></p>
                <button type="submit">Создать пользователя</button>
            </form>
        </section>
    </div>
    <div id="classifierModal" class="admin-user-modal" hidden>
        <section class="admin-user-dialog" role="dialog" aria-modal="true" aria-labelledby="classifierModalTitle">
            <button id="closeClassifierModal" class="admin-user-close" type="button" aria-label="Закрыть">&times;</button>
            <h2 id="classifierModalTitle"></h2>
            <form id="classifierForm">
                <label id="classifierCodeLabel">Код<input type="text" name="code" maxlength="50" required></label>
                <label>Название<input type="text" name="title" maxlength="255" required></label>
                <p id="classifierMessage" class="admin-user-message" aria-live="polite"></p>
                <button id="saveClassifierButton" type="submit">Сохранить</button>
            </form>
        </section>
    </div>
    <div id="genreModal" class="admin-user-modal" hidden>
        <section class="admin-user-dialog" role="dialog" aria-modal="true" aria-labelledby="genreModalTitle">
            <button id="closeGenreModal" class="admin-user-close" type="button" aria-label="Закрыть">×</button>
            <h2 id="genreModalTitle">Добавить жанр</h2>
            <form id="genreForm">
                <label>Название жанра<input type="text" name="name" maxlength="50" required></label>
                <p id="genreMessage" class="admin-user-message" aria-live="polite"></p>
                <button id="saveGenreButton" type="submit">Добавить жанр</button>
            </form>
        </section>
    </div>
</div>

<script src="/js/getDirections.js" type="text/javascript" defer></script>
<script src="/js/getPublishers.js" type="text/javascript"></script>
<script src="/js/getAuthors.js" type="text/javascript"></script>
<script src="/js/getLSItem.js" type="text/javascript"></script>
<script src="/js/getCities.js" type="text/javascript"></script>
<script src="/js/menues.js" type="text/javascript"></script>
<script src="/js/Hide_Show_Forms.js" type="text/javascript"></script>
<script src="/js/downloadFile.js" type="text/javascript"></script>
<script src="/js/admin-users.js"></script>
<script src="/js/admin-genres.js"></script>
<script src="/js/admin-classifiers.js"></script>
<script src="/js/admin-catalog.js"></script>
<script src="/js/admin-trash.js"></script>

<script>
    document.getElementById('homeBtn').addEventListener('click', () => {
        window.location.href = '/';
    });
</script>

<script>
    document.getElementById('add').addEventListener('click', () => {
        const active = document.querySelector('.nav button.active');
        if (!active) return;

        const key = active.dataset.key;

        if (key === 'directions' && window.getActiveClassifierTab?.() !== 'udc') {
            window.openClassifierForm(window.getActiveClassifierTab());
            return;
        }

        if (key === 'users') {
            document.getElementById('addUserModal').hidden = false;
            return;
        }
        if (key === 'genres') {
            document.getElementById('genreModal').hidden = false;
            return;
        }

        const formIds = {
            articles: 0,
            books: 0,
            authors: 1,
            publishers: 2,
            directions: 4
        };

        if (formIds[key] === undefined) return;

        showForm(formIds[key]);
    });
</script>
</body>
</html>
