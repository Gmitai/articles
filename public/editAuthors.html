<!DOCTYPE html>
<html lang="tj">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование автора</title>
    <link rel="stylesheet" href="/css/Forms_Style.css">
</head>
<body>
<div class="form-container">
    <h2>Редактирование</h2>

    <form id="editForm" onsubmit="submitAuthorForm(); return false;">
        <input type="hidden" id="rowId" name="rowId">

        <div class="form-group">
            <label for="name">ФИО:</label>
            <input type="text" id="name" name="fullName" required>
        </div>

        <div class="form-group">
            <label for="birthDate">Дата рождения:</label>
            <input type="date" id="birthDate" name="birthDate" required>
        </div>

        <div class="form-group">
            <label for="phoneNumber">Номер телефона:</label>
            <input type="text" id="phoneNumber" name="phoneNum" required>
        </div>

        <div class="form-group">
            <label for="city_List">Город/Страна:</label>
            <select id="city_List" name="selCity" required></select>
        </div>

        <div class="form-group">
            <label for="address">Аддресс:</label>
            <input type="text" id="address" name="address">
        </div>

        <div class="form-group">
            <button type="submit">Подтвердить</button>
            <button type="button" onclick="window.parent.closeIframe(getFrmId())">Назад</button>
        </div>
    </form>
</div>

<script src="/js/getDirections.js"></script>
<script src="/js/getCities.js"></script>
<script src="/js/getPublishers.js"></script>
<script src="/js/multiselect.js"></script>
<script src="/js/getLSItem.js" type="text/javascript"></script>
<script src="/js/dataForAuthorForm.js"></script>
</body>
</html>
